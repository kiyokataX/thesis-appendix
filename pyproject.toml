[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-thesis"
version = "0.1.0"
description = "Teaching implementations for a cryptography thesis"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
experiments = ["cryptography>=43", "requests>=2.32"]

[tool.setuptools.packages.find]
include = ["src*", "experiments*", "studies*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
